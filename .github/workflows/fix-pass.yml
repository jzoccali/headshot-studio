name: Fix-pass

# Dispatches Claude Code back onto an existing PR branch to fix issues.
# Reads the fix prompt from main, then switches to the PR branch to edit code.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Fix task id, e.g. FIX-UI-01"
        required: true
      pr_branch:
        description: "The PR branch to fix"
        required: true

concurrency:
  group: build-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (to read the current Prompt Library)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compose fix prompt from main
        id: compose
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
        run: |
          chmod +x build-loop/scripts/*.sh
          ./build-loop/scripts/extract-prompt.sh "$TASK_ID" --task-only > /tmp/fix-prompt.txt

      - name: Switch to the PR branch
        env:
          PR_BRANCH: ${{ github.event.inputs.pr_branch }}
        run: |
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"

      - name: Run Claude Code in fix mode
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: /tmp/fix-prompt.txt
          branch: ${{ github.event.inputs.pr_branch }}
          claude_args: "--max-turns 25 --model claude-opus-4-8"
          show_full_output: true
