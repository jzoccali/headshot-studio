    branch: feat/mobile-responsive
    preconditions: [UI-01]
    merge: auto

  - id: FEAT-01
    lane: frontend
    branch: feat/download-zip
    preconditions: [UI-01]
    merge: auto

  - id: FEAT-02
    lane: frontend
    branch: feat/error-handling
    preconditions: [UI-01]
    merge: auto
